services:
  mysql:
    image: mysql:8.0
    container_name: terzi-murat-mysql
    restart: always
    environment:
      MYSQL_DATABASE: terzi_murat
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - terzi_murat_mysql_data:/var/lib/mysql

volumes:
  terzi_murat_mysql_data: